version: "3.9"

# CrowdGuard Command — Local Development Stack
# Runs orchestrator + video-processor + frontend with hot-reload.
#
# Usage:
#   docker-compose up
#   docker-compose up --build --force-recreate

services:

  # ── Orchestrator Agent Service ─────────────────────────────────────────────
  orchestrator:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crowdguard_orchestrator
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-pro}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-crowdguard-sensor-data}
      - PYTHONPATH=/app/agent_orchestrator:/app/ml_model
      - PORT=8000
    volumes:
      - ../backend/agent_orchestrator:/app/agent_orchestrator:ro
      - ../backend/ml_model:/app/ml_model:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Video Processor Service ────────────────────────────────────────────────
  video_processor:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crowdguard_video_processor
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-crowdguard-sensor-data}
      - YOLO_MODEL_SIZE=${YOLO_MODEL_SIZE:-yolov8n}
      - PYTHONPATH=/app/video_processor
      - PORT=8001
    volumes:
      - ../backend/video_processor:/app/video_processor:ro
      - /tmp/crowdguard_frames:/tmp:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy

  # ── Frontend (Vite dev server for hot reload) ──────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: crowdguard_frontend
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ../frontend:/app:cached
      - /app/node_modules
    depends_on:
      - orchestrator
    restart: unless-stopped

networks:
  default:
    name: crowdguard_network
